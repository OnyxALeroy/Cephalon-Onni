server:
  port: 8080
  # Trust X-Forwarded-* from the TLS-terminating proxy so requests are seen as secure
  # (required for HSTS to be emitted and for correct redirect/scheme handling).
  forward-headers-strategy: framework

spring:
  application:
    name: cephalon-onni-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cephalon_onni}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    # Set APP_COOKIE_SECURE=true behind TLS (reverse-proxy/nginx); false keeps local dev simple.
    secure: ${APP_COOKIE_SECURE:false}
  catalog:
    # Import the static catalog (warframes, weapons, mods, drop tables, ...) at startup when the
    # warframes table is empty. Later refreshes: Admin page > System Configuration, or the cron.
    import-if-empty: ${CATALOG_IMPORT_IF_EMPTY:true}
    # Spring cron (6 fields), e.g. "0 0 5 * * MON"; "-" disables scheduled refreshes.
    refresh-cron: ${CATALOG_REFRESH_CRON:-}
    # Defaults for the source URLs; admins can override each one at runtime (stored in app_settings).
    defaults:
      export-index-url: https://origin.warframe.com/PublicExport/index_en.txt.lzma
      export-content-base-url: https://content.warframe.com/PublicExport/Manifest/
      drop-tables-url: https://www.warframe.com/droptables
  worldstate:
    url: https://api.warframe.com/cdn/worldState.php
    poll-interval-ms: ${WORLDSTATE_POLL_INTERVAL_MS:10000}

logging:
  level:
    com.cephalononni: INFO
