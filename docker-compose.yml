services:
  backend:
    build:
      context: ./backend
    container_name: cephalon-onni-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    develop:
      watch:
        - path: ./backend/src
          action: rebuild

  postgres:
    image: postgres:16-alpine
    container_name: cephalon-onni-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cephalon-onni-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    develop:
      watch:
        - path: ./frontend
          action: rebuild

  redis:
    image: redis:7-alpine
    container_name: cephalon-onni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  redisdata:
  postgresdata:
