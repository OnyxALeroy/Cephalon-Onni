services:
  backend:
    build:
      context: ./backend
    container_name: cephalon-onni-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis
      - postgres
    env_file:
      - .env
    volumes:
      - ./data:/app/data:z
    command: ["python", "-u", "app/main.py"]
    tty: true
    stdin_open: true
    develop:
      watch:
        - path: ./backend/app
          action: rebuild

  postgres:
    image: postgres:16-alpine
    container_name: cephalon-onni-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cephalon-onni-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    develop:
      watch:
        - path: ./frontend
          action: rebuild

  redis:
    image: redis:7-alpine
    container_name: cephalon-onni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mongodb:
    image: mongo:7
    container_name: cephalon-onni-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
  redisdata:
  postgresdata:
